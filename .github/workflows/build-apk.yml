name: Build Android APK

on:
  workflow_dispatch:            # bấm nút "Run workflow" trong tab Actions để build thủ công
  push:
    branches: [main]            # hoặc bỏ nếu chỉ muốn build thủ công

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 17 — bắt buộc cho Expo SDK 57 / RN 0.86)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (nhận license + đủ build-tools)
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          chmod 600 release.keystore

      - name: Generate native project (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
          # Absolute path — the signing block is injected into
          # android/app/build.gradle, where `file(...)` resolves relative to
          # the module dir. A relative 'release.keystore' would point at
          # android/app/release.keystore and fail the build.
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK (signed with project keystore)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK is signed with the project key (not debug)
        working-directory: android
        run: |
          # apksigner --print-certs shows the actual signer certificate.
          # Fail the build if the APK is still signed with the debug keystore.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Signer certificates:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          if "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "Android Debug"; then
            echo "::error::APK is signed with the DEBUG keystore — release signing was not applied"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prompt-template-manager-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
