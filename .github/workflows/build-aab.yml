name: Build Signed AAB (Play Store)

# Builds a Play-Store-ready AAB signed with the project keystore.
# The keystore never lives in the repo: it is stored (base64) in the
# ANDROID_KEYSTORE_BASE64 repository secret, decoded on the runner, and
# passed to the `withReleaseSigning` config plugin via env vars.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    — `base64 -w0 prompt-template-manager.keystore`
#   ANDROID_KEYSTORE_PASSWORD  — keystore store password
#   ANDROID_KEY_ALIAS          — key alias (e.g. prompttemplate)
#   ANDROID_KEY_PASSWORD       — key password
#
# No EAS token needed — runs expo prebuild + ./gradlew bundleRelease directly.

on:
  workflow_dispatch:            # bấm nút "Run workflow" để build thủ công
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'db/**'
      - 'hooks/**'
      - 'lib/**'
      - 'plugins/**'
      - 'types/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'patches/**'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 17 — bắt buộc cho Expo SDK 57 / RN 0.86)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          chmod 600 release.keystore

      - name: Generate native project (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
          # Absolute path — the signing block is injected into
          # android/app/build.gradle, where `file(...)` resolves relative to
          # the module dir. A relative 'release.keystore' would point at
          # android/app/release.keystore and fail the build.
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify AAB is signed with the project key (not debug)
        working-directory: android
        run: |
          # apksigner --print-certs shows the actual signer certificate.
          # Fail the build if the AAB is still signed with the debug keystore
          # (Play Console rejects debug-signed bundles).
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Signer certificates:"
          "$APKSIGNER" verify --print-certs app/build/outputs/bundle/release/app-release.aab
          if "$APKSIGNER" verify --print-certs app/build/outputs/bundle/release/app-release.aab | grep -q "Android Debug"; then
            echo "::error::AAB is signed with the DEBUG keystore — release signing was not applied"
            exit 1
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: prompt-template-manager-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
